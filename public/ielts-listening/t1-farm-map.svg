<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Oakfield Community Farm</title>
  <rect width="640" height="470" fill="#ffffff"/>
  <!-- farm boundary (gap for the entrance) -->
  <rect x="21.5" y="21.5" width="597" height="377" rx="16" fill="#f1f6ec" stroke="none"/>
  <path d="M295 400 H38 a18 18 0 0 1 -18 -18 V38 a18 18 0 0 1 18 -18 H602 a18 18 0 0 1 18 18 V382 a18 18 0 0 1 -18 18 H345" fill="none" stroke="#5f7f4f" stroke-width="3"/>
  <!-- gate posts -->
  <rect x="289" y="393" width="8" height="14" fill="#5f7f4f"/>
  <rect x="343" y="393" width="8" height="14" fill="#5f7f4f"/>

  <!-- fields (labelled) -->
  <rect x="130" y="40" width="132" height="100" rx="6" fill="#dcebc9" stroke="#8aa977" stroke-dasharray="6 4"/>
  <text x="196" y="95" text-anchor="middle" font-size="15" fill="#33452a">Sheep field</text>
  <rect x="378" y="40" width="132" height="100" rx="6" fill="#e8f0d2" stroke="#8aa977" stroke-dasharray="6 4"/>
  <text x="444" y="86" text-anchor="middle" font-size="15" fill="#33452a">Vegetable</text>
  <text x="444" y="104" text-anchor="middle" font-size="15" fill="#33452a">garden</text>

  <!-- paths -->
  <rect x="308" y="270" width="24" height="132" fill="#dccca6"/>
  <rect x="308" y="88" width="24" height="70" fill="#dccca6"/>
  <ellipse cx="320" cy="215" rx="105" ry="62" fill="none" stroke="#dccca6" stroke-width="20"/>

  <!-- duck pond -->
  <ellipse cx="320" cy="215" rx="78" ry="40" fill="#a9d2ee" stroke="#6fa6cc" stroke-width="2"/>
  <text x="320" y="220" text-anchor="middle" font-size="15" fill="#1d4a6b">Duck pond</text>

  <!-- lettered buildings / areas -->
  <g font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">
    <rect x="200" y="348" width="86" height="44" rx="5" fill="#fff" stroke="#374151" stroke-width="2"/><text x="243" y="378">A</text>
    <rect x="354" y="348" width="86" height="44" rx="5" fill="#fff" stroke="#374151" stroke-width="2"/><text x="397" y="378">B</text>
    <rect x="118" y="192" width="78" height="46" rx="5" fill="#fff" stroke="#374151" stroke-width="2"/><text x="157" y="223">C</text>
    <rect x="444" y="192" width="78" height="46" rx="5" fill="#fff" stroke="#374151" stroke-width="2"/><text x="483" y="223">D</text>
    <rect x="40" y="40" width="78" height="46" rx="5" fill="#fff" stroke="#374151" stroke-width="2"/><text x="79" y="71">E</text>
    <rect x="278" y="40" width="84" height="48" rx="5" fill="#fff" stroke="#374151" stroke-width="2"/><text x="320" y="72">F</text>
    <rect x="522" y="40" width="78" height="46" rx="5" fill="#fff" stroke="#374151" stroke-width="2"/><text x="561" y="71">G</text>
    <rect x="212" y="286" width="84" height="42" rx="5" fill="#fff" stroke="#374151" stroke-width="2"/><text x="254" y="315">H</text>
  </g>

  <!-- outside the farm -->
  <rect x="90" y="410" width="170" height="46" rx="5" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="175" y="438" text-anchor="middle" font-size="15" fill="#374151">Car park</text>
  <path d="M320 452 V418 M311 427 L320 416 L329 427" fill="none" stroke="#111827" stroke-width="2.5"/>
  <text x="372" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Entrance</text>

  <!-- north arrow -->
  <g transform="translate(588 432)">
    <path d="M0 18 V-14 M-7 -5 L0 -16 L7 -5" fill="none" stroke="#111827" stroke-width="2.5"/>
    <text x="16" y="6" font-size="15" font-weight="700" fill="#111827">N</text>
  </g>
</svg>
