<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Westfield Library: ground floor</title>
  <rect width="640" height="470" fill="#ffffff"/>
  <!-- building -->
  <rect x="30" y="30" width="580" height="370" fill="#f8fafc"/>

  <!-- lettered rooms -->
  <g fill="#ffffff" stroke="#334155" stroke-width="2">
    <rect x="30" y="30" width="140" height="112"/>   <!-- C -->
    <rect x="170" y="30" width="145" height="92"/>   <!-- D -->
    <rect x="315" y="30" width="145" height="92"/>   <!-- E -->
    <rect x="460" y="30" width="150" height="112"/>  <!-- F -->
    <rect x="30" y="162" width="120" height="118"/>  <!-- B -->
    <rect x="490" y="162" width="120" height="118"/> <!-- G -->
    <rect x="30" y="296" width="120" height="104"/>  <!-- A -->
    <rect x="490" y="296" width="120" height="104"/> <!-- H -->
  </g>
  <g font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">
    <circle cx="100" cy="86" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="100" y="94">C</text>
    <circle cx="242" cy="76" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="242" y="84">D</text>
    <circle cx="387" cy="76" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="387" y="84">E</text>
    <circle cx="535" cy="86" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="535" y="94">F</text>
    <circle cx="90" cy="221" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="90" y="229">B</text>
    <circle cx="550" cy="221" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="550" y="229">G</text>
    <circle cx="90" cy="348" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="90" y="356">A</text>
    <circle cx="550" cy="348" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="550" y="356">H</text>
  </g>

  <!-- fiction shelves (labelled) -->
  <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round">
    <line x1="232" y1="182" x2="408" y2="182"/>
    <line x1="232" y1="268" x2="408" y2="268"/>
  </g>
  <rect x="222" y="170" width="196" height="110" rx="6" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="320" y="230" text-anchor="middle" font-size="15" fill="#334155">Fiction shelves</text>

  <!-- stairs (labelled) -->
  <rect x="170" y="318" width="80" height="70" fill="#e2e8f0" stroke="#64748b"/>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="170" y1="332" x2="250" y2="332"/><line x1="170" y1="346" x2="250" y2="346"/>
    <line x1="170" y1="360" x2="250" y2="360"/><line x1="170" y1="374" x2="250" y2="374"/>
  </g>
  <text x="210" y="312" text-anchor="middle" font-size="14" fill="#334155">Stairs</text>

  <!-- reception (labelled) -->
  <rect x="270" y="320" width="100" height="38" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="320" y="344" text-anchor="middle" font-size="14" fill="#1e293b">Reception</text>

  <!-- lift (labelled) -->
  <rect x="396" y="324" width="48" height="48" fill="#e2e8f0" stroke="#64748b"/>
  <path d="M410 340 L420 332 L430 340 M410 356 L420 364 L430 356" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="420" y="318" text-anchor="middle" font-size="14" fill="#334155">Lift</text>

  <!-- outer walls, with a gap for the entrance -->
  <path d="M290 400 H30 V30 H610 V400 H350" fill="none" stroke="#0f172a" stroke-width="4"/>
  <path d="M320 454 V414 M311 423 L320 412 L329 423" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <text x="372" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Entrance</text>
</svg>
