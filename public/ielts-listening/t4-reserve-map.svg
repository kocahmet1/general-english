<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Arial, Helvetica, sans-serif">
  <title>Millbrook Nature Reserve</title>
  <rect width="640" height="470" fill="#ffffff"/>
  <!-- reserve boundary -->
  <rect x="30" y="30" width="580" height="370" fill="#f3f8f1" stroke="#0f172a" stroke-width="3"/>

  <!-- woodland (labelled) -->
  <path d="M32 32 H210 C200 70 190 110 170 140 C140 175 90 180 32 172 Z" fill="#dcebd5"/>
  <g fill="#9cc58f" stroke="#5d8f52" stroke-width="1.5">
    <circle cx="60" cy="60" r="13"/><circle cx="96" cy="52" r="11"/><circle cx="140" cy="60" r="12"/>
    <circle cx="178" cy="54" r="10"/><circle cx="52" cy="140" r="11"/><circle cx="150" cy="120" r="10"/>
    <circle cx="70" cy="104" r="9"/>
  </g>
  <text x="128" y="160" text-anchor="middle" font-size="14" fill="#334155">Woodland</text>

  <!-- river (labelled) -->
  <path d="M520 30 C505 90 535 140 520 200 C505 260 535 320 520 400" fill="none" stroke="#7fb3dc" stroke-width="16"/>
  <text x="560" y="122" text-anchor="middle" font-size="14" fill="#334155" transform="rotate(-80 560 122)">River</text>

  <!-- footbridge (labelled) -->
  <rect x="500" y="193" width="40" height="14" fill="#c8a97e" stroke="#7a5c35" stroke-width="1.5"/>
  <text x="520" y="230" text-anchor="middle" font-size="12" fill="#334155">Footbridge</text>

  <!-- lake (labelled) -->
  <ellipse cx="300" cy="205" rx="125" ry="72" fill="#cfe4f5" stroke="#7fb3dc" stroke-width="2"/>
  <text x="300" y="211" text-anchor="middle" font-size="16" fill="#1e3a5f">Lake</text>

  <!-- path around the lake and to the bridge -->
  <g fill="none" stroke="#b08d57" stroke-width="3" stroke-dasharray="7 5">
    <ellipse cx="300" cy="205" rx="150" ry="98"/>
    <path d="M320 330 V303"/>
    <path d="M440 170 C470 180 490 195 500 200"/>
  </g>

  <!-- car park (labelled) -->
  <rect x="50" y="320" width="130" height="62" rx="4" fill="#e2e8f0" stroke="#64748b"/>
  <text x="115" y="356" text-anchor="middle" font-size="14" fill="#1e293b">Car park</text>

  <!-- visitor centre (labelled) -->
  <rect x="268" y="330" width="104" height="44" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="320" y="349" text-anchor="middle" font-size="13" fill="#1e293b">Visitor</text>
  <text x="320" y="365" text-anchor="middle" font-size="13" fill="#1e293b">centre</text>

  <!-- lettered places -->
  <g font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">
    <circle cx="440" cy="350" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="440" y="358">A</text>
    <circle cx="152" cy="205" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="152" y="213">B</text>
    <circle cx="100" cy="88" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="100" y="96">C</text>
    <circle cx="300" cy="109" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="300" y="117">D</text>
    <circle cx="470" cy="72" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="470" y="80">E</text>
    <circle cx="470" cy="262" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="470" y="270">F</text>
    <circle cx="580" cy="200" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="580" y="208">G</text>
    <circle cx="215" cy="305" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="215" y="313">H</text>
    <circle cx="578" cy="352" r="18" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="578" y="360">I</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(600 440)">
    <path d="M0 -18 L7 4 L0 0 L-7 4 Z" fill="#0f172a"/>
    <text x="0" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">N</text>
  </g>

  <!-- entrance -->
  <path d="M320 454 V414 M311 423 L320 412 L329 423" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <text x="372" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Entrance</text>
</svg>
